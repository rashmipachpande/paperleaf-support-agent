services:
  - type: web
    name: paperleaf-support-agent
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn webapp:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      # The deployed Vercel frontend's origin(s), comma-separated.
      - key: ALLOWED_ORIGINS
        value: https://paperleaf-support-agent.vercel.app,http://localhost:8000
      # Secrets: Render asks for these in the dashboard (they are never stored in the repo)
      - key: GOOGLE_API_KEY
        sync: false
      - key: APP_PASSCODE
        sync: false
