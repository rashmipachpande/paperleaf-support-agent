services:
  - type: web
    name: paperleaf-support-agent
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      # Secrets: Render asks for these in the dashboard (they are never stored in the repo)
      - key: GOOGLE_API_KEY
        sync: false
      - key: APP_PASSCODE
        sync: false
